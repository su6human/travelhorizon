<!DOCTYPE html>
<html lang="en" data-page="admin" data-title-key="admin.page.editor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site editor — TravelHorizon</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A2C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/styles.css?v=1.0.1">
<script src="/boot.js?v=1.0.1"></script>
<script src="/data.js?v=1.0.1" defer></script>
<script src="/i18n.js?v=1.0.1" defer></script>
<script src="/script.js?v=1.0.1" defer></script>
</head>
<body class="admin-body">
  <header class="site-header site-header--admin" data-header>
    <div class="site-header__inner">
      <a class="brand" href="/"><svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M7 20a9 9 0 0 1 18 0" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 20h28" stroke="currentColor" stroke-width="1.6"/><path d="M9 24.5h14" stroke="currentColor" stroke-width="1.6" opacity=".55"/></svg><span class="brand__name">TravelHorizon</span></a>
      <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:nav.language">
        <button type="button" data-set-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        <button type="button" data-set-lang="ru" lang="ru" aria-label="Русский" aria-pressed="false">RU</button>
        <button type="button" data-set-lang="ky" lang="ky" aria-label="Кыргызча" aria-pressed="false">KY</button>
      </div>
    </div>
  </header>
  <main id="main" class="editor" tabindex="-1">
    <div class="editor__top">
      <div class="editor__heading">
        <h1 class="display-3" data-i18n="admin.editor.title">Site editor</h1>
        <p class="editor__user" data-editor-user></p>
      </div>
      <div class="editor__session">
        <a class="text-link" href="/" target="_blank" rel="noopener" data-i18n="admin.editor.viewSite">View website</a>
        <button type="button" class="button button--small button--ghost" data-editor-signout data-i18n="admin.editor.signOut">Sign out</button>
      </div>
    </div>

    <div class="editor__toolbar" role="toolbar" aria-label="Site editor">
      <div class="editor__langs" role="group" aria-labelledby="editor-lang-label">
        <span class="editor__label" id="editor-lang-label" data-i18n="admin.editor.language">Language to edit</span>
        <button type="button" class="chip" data-edit-lang="en" aria-pressed="true">English</button>
        <button type="button" class="chip" data-edit-lang="ru" aria-pressed="false">Русский</button>
        <button type="button" class="chip" data-edit-lang="ky" aria-pressed="false">Кыргызча</button>
      </div>
      <div class="editor__search">
        <label class="editor__label" for="editor-search" data-i18n="admin.editor.search">Find text</label>
        <input class="input" id="editor-search" type="search" placeholder="Search by text or key" data-i18n-attr="placeholder:admin.editor.searchPlaceholder">
      </div>
      <div class="editor__actions">
        <button type="button" class="button" data-editor-save disabled><span data-i18n="admin.editor.save">Save changes</span></button>
        <button type="button" class="button button--ghost" data-editor-export data-i18n="admin.editor.export">Download backup</button>
        <label class="button button--ghost editor__import">
          <span data-i18n="admin.editor.import">Import backup</span>
          <input type="file" accept="application/json,.json" class="visually-hidden" data-editor-import>
        </label>
        <button type="button" class="button button--danger" data-editor-restore data-i18n="admin.editor.restore">Restore original text</button>
      </div>
    </div>
    <div class="editor__statusbar">
      <p class="editor__dirty" data-editor-dirty data-i18n="admin.editor.clean">All changes saved</p>
      <div class="form-status" id="editor-status" role="status" aria-live="polite" hidden></div>
    </div>
    <p class="fine-print editor__note" data-i18n="admin.editor.note">Prices, seasons and photos are set in public/data.js. Leave a field unchanged to keep the original text.</p>

    <div class="editor__layout">
      <nav class="editor__nav" aria-labelledby="editor-sections">
        <h2 class="editor__label" id="editor-sections" data-i18n="admin.editor.sections">Sections</h2>
        <ul data-editor-nav></ul>
      </nav>
      <div class="editor__fields" data-editor-fields aria-busy="true">
        <p class="lead" data-i18n="admin.editor.loading">Loading content…</p>
      </div>
    </div>
  </main>
</body>
</html>

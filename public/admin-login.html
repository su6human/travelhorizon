<!DOCTYPE html>
<html lang="en" data-page="admin-login" data-title-key="admin.page.login">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Site editor</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A2C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/styles.css?v=1.0.1">
<script src="/boot.js?v=1.0.1"></script>
<script src="/data.js?v=1.0.1" defer></script>
<script src="/i18n.js?v=1.0.1" defer></script>
<script src="/script.js?v=1.0.1" defer></script>
</head>
<body class="admin-body">
  <header class="site-header site-header--admin" data-header>
    <div class="site-header__inner">
      <a class="brand" href="/"><svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M7 20a9 9 0 0 1 18 0" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 20h28" stroke="currentColor" stroke-width="1.6"/><path d="M9 24.5h14" stroke="currentColor" stroke-width="1.6" opacity=".55"/></svg><span class="brand__name">TravelHorizon</span></a>
      <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:nav.language">
        <button type="button" data-set-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        <button type="button" data-set-lang="ru" lang="ru" aria-label="Русский" aria-pressed="false">RU</button>
        <button type="button" data-set-lang="ky" lang="ky" aria-label="Кыргызча" aria-pressed="false">KY</button>
      </div>
    </div>
  </header>
  <main id="main" class="admin-login" tabindex="-1">
    <div class="admin-login__card">
      <h1 class="display-2" data-i18n="admin.login.title">Site editor</h1>
      <p class="lead" data-i18n="admin.login.lead">Sign in to edit the website text.</p>
      <form class="admin-login__form" id="login-form" novalidate>
        <div class="form-status" id="login-status" role="alert" aria-live="assertive" hidden></div>
        <div class="field">
          <label class="field__label" for="login-username" data-i18n="admin.login.username">Username</label>
          <input class="input" id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label class="field__label" for="login-password" data-i18n="admin.login.password">Password</label>
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button button--large button--block" type="submit" data-submit><span data-i18n="admin.login.submit">Sign in</span></button>
      </form>
      <a class="text-link" href="/" data-i18n="admin.login.back">Back to the website</a>
    </div>
  </main>
</body>
</html>

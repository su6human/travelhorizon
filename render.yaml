# Render Blueprint: New → Blueprint → connect this repository.
# The persistent disk needs a paid instance type (Starter or higher).
services:
  - type: web
    name: travelhorizon
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: CONTENT_FILE
        value: /var/data/content.json
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: travelhorizon-content
      mountPath: /var/data
      sizeGB: 1
